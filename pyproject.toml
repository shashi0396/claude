build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snow-workflow-bots"
version = "0.1.0"
description = "Adaptive ServiceNow workflow bots for HR-driven ticket creation (onboarding, offboarding, etc.)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
snow-bot = "snow_workflow_bots.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["snow_workflow_bots*", "mcp_servers*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"